/* ---------------- voice UI ---------------- */
var voiceAuto = false;

var voiceTarget = "ask";
var micOk = null;   // null = not asked yet, "ok" = permission granted, else the error name
function showVoiceError(err){
  var tr = $("#vtrans");
  var msg, hint = "";
  if (err === "insecure") { msg = t("voice.insecure", { origin: location.origin }); }
  else if (err === "SecurityError" || err === "frame") { msg = t("voice.frame"); }
  else if (err === "file") { msg = t("voice.needsServer"); }
  else if (err === "NotAllowedError" || err === "SecurityError" || err === "not-allowed" || err === "service-not-allowed") {
    msg = t("voice.denied"); hint = t("voice.deniedHint");
  }
  else if (err === "NotFoundError" || err === "DevicesNotFoundError") { msg = t("voice.noMic"); }
  else if (err === "NotReadableError" || err === "TrackStartError") { msg = t("voice.busy"); }
  else if (err === "network" || err === "speech-service") { msg = t("voice.svcDown"); }
  else if (err === "unsupported") { msg = t("voice.unsupported"); }
  else { msg = t("voice.svcDown"); }
  var env = voiceEnv();
  tr.innerHTML = msg + (hint ? '<span style="display:block;font-size:13px;color:var(--muted);margin-top:8px">' + hint + "</span>" : "") +
    ((env.frame || err === "frame")
      ? '<a class="btn primary" href="' + location.href + '" target="_blank" rel="noopener" style="margin-top:12px">' + t("voice.openTab") + "</a>" +
        '<span style="display:block;font-size:12.5px;color:var(--muted);margin-top:10px">' + t("voice.openHint") + "</span>" +
        '<code style="display:block;margin-top:6px;font-family:var(--font-mono);font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;user-select:all;word-break:break-all">http://localhost:8000/Paytm_Vyaapar_Saathi.html</code>'
      : "") +
    '<span style="display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-3);margin-top:10px;line-height:1.6">' +
    err + " · " + env.proto + " · secure=" + env.secure + " · mic=" + env.gum + " · rec=" + env.rec + " · frame=" + env.frame + "</span>";
  // the anchor above needs no handler
  tr.style.fontSize = "17px";
  tr.style.lineHeight = "1.45";
  $("#vtype").style.display = "";
  $("#vretry").style.display = "";
  var ph = $("#vphrases");
  if (ph) { ph.style.display = "block"; ph.textContent = t("voice.phrase"); }
}
function voiceEnv(){
  return { proto: location.protocol, secure: !!window.isSecureContext,
           frame: (function(){ try { return window.self !== window.top; } catch (e) { return true; } })(),
           gum: !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia),
           rec: !!(window.SpeechRecognition || window.webkitSpeechRecognition) };
}
function ensureMic(){
  return new Promise(function(resolve, reject){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return reject("insecure");
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      stream.getTracks().forEach(function(t){ t.stop(); });
      micOk = "ok";
      resolve("ok");
    }).catch(function(err){
      micOk = (err && err.name) || "error";
      reject(micOk);
    });
  });
}
function listenFlow(target){
  voiceTarget = target || "ask";
  var ov = $("#voverlay"), tr = $("#vtrans");
  tr.style.fontSize = "24px";
  tr.style.lineHeight = "1.3";
  tr.textContent = t("voice.listening") + "…";
  $("#vtype").style.display = "none";
  $("#vretry").style.display = "none";
  ov.classList.add("on");

  // On file:// there is no origin to grant a microphone to.
  var env = voiceEnv();
  if (env.proto === "file:") { showVoiceError("file"); return; }
  // http on a LAN IP is not a secure origin: Chrome hides the mic entirely
  if (!env.secure) { showVoiceError("insecure"); return; }
  if (!env.rec) { showVoiceError("unsupported"); return; }

  // If a transcription proxy is configured, record and send the audio: that path does
  // not depend on the browser's speech service at all.
  if (CFG.proxy && !CFG.offline && navigator.mediaDevices && window.MediaRecorder) { recordPath(target); return; }

  // Otherwise fall back to the browser's own recogniser. It manages its own microphone
  // permission, so never gate it behind getUserMedia: inside an embedded frame that call
  // throws SecurityError even when recognition itself is allowed to run.
  startRecognition();

  function startRecognition(){
  var finished = false;
  var started = Voice.listen({
    onInterim: function(txt){ if (txt && !finished) tr.textContent = txt; },
    onFinal: function(txt){
      finished = true;
      ov.classList.remove("on");
      if (!txt) return;
      if (voiceTarget === "checkin") { $("#ck-input").value = txt; runCheckin(txt); }
      else { $("#ask-input").value = txt; ask(txt); }
    },
    onError: function(err){
      finished = true;
      // ask the mic API why, but only as an explanation — recognition already tried
      ensureMic().then(function(){
        showVoiceError("speech-service");
      }).catch(function(why){
        showVoiceError(why === "SecurityError" && voiceEnv().frame ? "frame" : (why || err));
      });
    },
    onEnd: function(){ if (!finished) { setTimeout(function(){ if (!finished) ov.classList.remove("on"); }, 2500); } }
  });
  if (!started) { showVoiceError("unsupported"); return; }
  setTimeout(function(){
    if (!finished && tr.textContent === t("voice.listening") + "…") {
      showVoiceError("speech-service");
    }
  }, 8000);
  }
}
function askByVoice(){ listenFlow("ask"); }
function checkinByVoice(){ listenFlow("checkin"); }

          '</div><div><button class="btn" data-ckgoto="' + a.tab + '">' + t("card.open") + " →</button></div></div>";
      }).join("") +
      '<div><button class="btn ghost" id="ck-again">' + t("ck.again") + "</button></div>" +
    "</div>";
}

document.addEventListener("click", function(e){
  var g = e.target.closest("[data-goto]");
  if (g) {
    e.preventDefault();
    go(g.getAttribute("data-goto"));
    var anc = g.getAttribute("data-anchor");
    if (anc) setTimeout(function(){ var el = document.getElementById(anc); if (el) el.scrollIntoView({behavior:"smooth"}); }, 80);
    return;
  }
  if (g) {
    var v = g.getAttribute("data-goto");
    var btn = $('#rail button[data-view="' + v + '"]');
    if (btn) btn.click();
    return;
  }
  var rf = e.target.closest("[data-invfilter]");
  if (rf) { invFilter = rf.getAttribute("data-invfilter"); renderInv(); return; }
  var rs = e.target.closest("[data-restock]");
  if (rs) {
    var nm = rs.getAttribute("data-restock");
    if (restock[nm]) delete restock[nm];
    else {
      var it = A.inv.filter(function(x){ return x.name === nm; })[0];
      restock[nm] = it ? it.suggestQty : 1;
    }
    rs.classList.toggle("on", !!restock[nm]);
    rs.textContent = restock[nm] ? t("inv.added") : t("inv.reorder");
    updateOrderUI();
    return;
  }
  var oh = e.target.closest("[data-hours]");
  if (oh) { DEMO_HOURS = true; audit("hours.override", "manual, from a blocked send"); closeAllModals(); renderAll(); return; }
  var ap = e.target.closest("[data-approve]");
  if (ap) {
    var k2 = ap.getAttribute("data-approve");
    approved[k2] = true;
    audit("approve", k2);
    if (k2.indexOf("wait:") === 0) renderWaitModal();
    else if (k2.indexOf("bill:") === 0) renderBill();
    else if (k2.indexOf("rm:") === 0) renderRm();
    else renderModal();
    return;
  }
  var bl = e.target.closest("[data-bill]");
  if (bl) { openBill(bl.getAttribute("data-bill")); return; }
  var wb = e.target.closest("[data-wait]");
  if (wb) {
    var wi = wb.getAttribute("data-wait");
    waitSent[wi] = true;
    renderWait();
    openWait(wi);
    return;
  }
  var sy = e.target.closest("[data-say]");
  if (sy) { var mi = +sy.getAttribute("data-say"); if (chat[mi]) Voice.speak(chat[mi].plain || chat[mi].html); return; }
  var sr = e.target.closest("[data-source]");
  if (sr) { openSourcing(sr.getAttribute("data-source")); return; }
  var rm = e.target.closest("[data-remind]");
  if (rm) { openReminder(rm.getAttribute("data-remind")); return; }
  var w = e.target.closest("[data-winback]");
  if (w) { openWinback(w.getAttribute("data-winback")); return; }
  var f = e.target.closest("[data-filter]");
  if (f) { custFilter = f.getAttribute("data-filter"); renderCustomers(); return; }
  var o = e.target.closest("[data-order]");
  if (o) {
    var nm = o.getAttribute("data-order");
    order[nm] = !order[nm];
    o.classList.toggle("on", !!order[nm]);
    o.textContent = order[nm] ? t("stock.added") : t("stock.addOrder");
    updateOrderUI();
    return;
  }
  var d = e.target.closest("[data-done]");
  if (d) { var i = +d.getAttribute("data-done"); actioned[i] = !actioned[i]; renderFeedback(); return; }
  var ch = e.target.closest("[data-chip]");
  if (ch) { ask(ch.getAttribute("data-chip")); return; }
  var ml = e.target.closest("#msg-lang button");
  if (ml) { msgLang = ml.getAttribute("data-lang"); renderModal(); return; }
});

});

function rmConduct(kind){
  var r = activeRecv; if (!r) return;
  var c = consentOf(r.cid);
  if (kind === "paid") {
    A.money.recv = A.money.recv.filter(function(x){ return x.cid !== r.cid; });
    A.kpis.recvTotal -= r.amount;
    audit("udhaar.paid", r.cid + " " + money(r.amount));
  } else if (kind === "dispute") {
    c.dispute = true; audit("udhaar.dispute", r.cid);
  } else if (kind === "hardship") {
    c.hardship = true; audit("udhaar.hardship", r.cid + " — owner notified");
  } else if (kind === "stop") {
    c.optout = true; audit("optout", r.cid);
  }
  $("#rm-modal").classList.remove("open");
  renderMoney(); renderTrust();
}

});
